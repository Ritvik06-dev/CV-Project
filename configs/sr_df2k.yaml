# 4x super-resolution: train on DF2K HR images, test on BSD100 / Urban100 (Table 4).
# The paper does not state the scale factor; 4x is the usual choice in the works
# it follows ([8], [33]). y = bicubic down-4 then up-4 back to 256.
# DF2K = DIV2K + Flickr2K HR images in one folder; get them yourself and set the paths.
out_dir: runs/sr_df2k
data:
  type: sr
  image_size: 256
  scale: 4
  train_root: data/DF2K_HR
  test_roots: [data/BSD100_HR, data/Urban100_HR]
  test_set: 0                # 0 = BSD100, 1 = Urban100 (override data.test_set=1)
  crops_per_image: 8
model:
  num_timesteps: 1000
  condition: true
  loss: l1
  clip_denoised: true
unet:
  model_channels: 64
  channel_mult: [1, 1, 2, 2, 4]
  num_res_blocks: 2
  attention_resolutions: [16]
  dropout: 0.0
train:
  iters: 100000
  batch_size: 4
  grad_accum: 2
  lr: 1.0e-4
  ema_decay: 0.999
  num_workers: 2
  log_every: 100
  preview_every: 2000
  save_every: 5000
